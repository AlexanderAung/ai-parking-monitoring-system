__include__:
  [
    "../data/baseline-v1-eval.yml",
    "../../thrid-party/RT-DETR/rtdetrv2_pytorch/configs/runtime.yml",
    "../../thrid-party/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/dataloader.yml",
    "../../thrid-party/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/optimizer.yml",
    "../../thrid-party/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/rtdetrv2_r50vd.yml",
  ]

output_dir: runs/baseline-001/eval-epoch19
summary_dir: runs/baseline-001/evaluation-local/tensorboard

use_ema: True
use_amp: False

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3

epoches: 50

train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      policy:
        epoch: 40
  collate_fn:
    scales: ~
